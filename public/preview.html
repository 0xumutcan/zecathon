<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karakter Önizleme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #14141f; --fg: #e8e6f0; --muted: #8a87a0; --gold: #f4b728; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* the character canvas renders at native pixel-art resolution and is upscaled without smoothing;
     the background canvas underneath is full device resolution so the scene stays sharp */
  #c { image-rendering: pixelated; }
  #bar { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  button { background: #22222f; color: var(--fg); border: 1px solid #33334a; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--gold); color: var(--gold); }
  #hint { position: fixed; bottom: 12px; left: 16px; color: var(--muted); }

  /* pixel speech bubble; --px = one art pixel in screen px, set from JS */
  #bubble {
    --px: 3px; --ink: #1a1a24; --paper: #f2efe6;
    position: fixed; left: 0; top: 0; max-width: min(320px, calc(100vw - 32px));
    padding: calc(var(--px) * 3) calc(var(--px) * 4);
    background: var(--paper); color: var(--ink);
    font: 600 18px/1.25 "Pixelify Sans", monospace;
    /* stepped outline: four flat shadows give a hard pixel border with notched corners */
    box-shadow:
      0 calc(var(--px) * -1) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink),
      calc(var(--px) * -1) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink),
      0 calc(var(--px) * 2) 0 0 rgba(0, 0, 0, .35);
    pointer-events: none; white-space: pre-wrap;
    opacity: 0; transform-origin: var(--tail-x, 50%) 100%;
    transition: opacity .12s steps(2), scale .12s steps(2);
    scale: .6;
  }
  #bubble.show { opacity: 1; scale: 1; }
  /* tail: a stepped triangle hanging under the bubble, pointing at the head */
  #bubble::after {
    content: ""; position: absolute; top: 100%; left: var(--tail-x, 50%);
    width: calc(var(--px) * 4); height: calc(var(--px) * 4); margin-left: calc(var(--px) * -2);
    background: var(--paper);
    clip-path: polygon(0 0, 100% 0, 100% 25%, 75% 25%, 75% 50%, 50% 50%, 50% 75%, 25% 75%, 25% 100%, 0 100%);
    filter: drop-shadow(var(--px) 0 0 var(--ink)) drop-shadow(calc(var(--px) * -1) 0 0 var(--ink)) drop-shadow(0 var(--px) 0 var(--ink));
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<div id="bubble"></div>
<div id="bar"></div>
<div id="hint">Saf hâl: mouse'u bırakınca amaçsızca yürür, hareket ettirince peşinden gelir</div>
<script>
const VARIANTS = ["0_base", "1_cap", "2_tee", "3_jacket", "4_sneakers", "5_master"];
const LABELS = ["Saf", "Şapka", "Tişört", "Ceket", "Ayakkabı", "Master"];
// tools/measure-walk.mjs: one step = ~19 frames @24fps covering ~59 art px -> ~74 px/s at full playback.
// Playing the cycle slower keeps the lazy feel; ground speed scales with it so the feet don't slide.
const WALK_RATE = 0.75;
const WALK_SPEED = 74 * WALK_RATE;
const IDLE_AFTER = 2500;   // ms without mouse movement before he wanders off again

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const bubble = document.getElementById("bubble");
let S = 3; // screen px per art pixel
const bgCanvas = document.getElementById("bg");
const bctx = bgCanvas.getContext("2d");
let DPR = 1;
function resize() {
  // character (~220 art px tall) ends up around 40% of the viewport; integer scale keeps pixels crisp
  S = Math.max(1, Math.round((innerHeight * 0.4) / 220));
  bubble.style.setProperty("--px", S + "px");
  canvas.width = Math.ceil(innerWidth / S);
  canvas.height = Math.ceil(innerHeight / S);
  ctx.imageSmoothingEnabled = false;
  DPR = Math.min(2, devicePixelRatio || 1);
  bgCanvas.width = Math.round(innerWidth * DPR);
  bgCanvas.height = Math.round(innerHeight * DPR);
  bctx.imageSmoothingQuality = "high";
}
addEventListener("resize", resize);
resize();

const sheets = {};
async function load(name) {
  if (sheets[name]) return sheets[name];
  const [meta, img] = await Promise.all([
    fetch(`character/${name}.json`).then((r) => r.json()),
    new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = `character/${name}.webp`; }),
  ]);
  if (meta.gaze) {
    // circle frames (the sweep) sorted by angle; frame 0 is the straight-ahead pose
    meta.ring = [];
    meta.gaze.forEach(([gx, gy], i) => {
      if (Math.abs(Math.hypot(gx, gy) - 1) < 0.01) meta.ring.push({ i, a: Math.atan2(gy, gx) });
    });
  }
  return (sheets[name] = { meta, img });
}

// ---- background ---------------------------------------------------------------
let bg = null;
let floorY = 0; // character-canvas y of the walkable ground, derived from the background each frame
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
(async () => {
  const [meta, img, off] = await Promise.all([
    fetch("env/surface.json").then((r) => r.json()),
    loadImg("env/surface.webp"),
    loadImg("env/surface_off.webp"),
  ]);
  // every camera blinks on its own rhythm so they never pulse in sync
  meta.lights.forEach((l) => { l.period = 1.4 + Math.random() * 1.6; l.phase = Math.random(); });
  bg = { meta, img, off };
})();

// fog: a horizontally tileable strip of soft blobs, built once
const fog = document.createElement("canvas");
fog.width = 1024; fog.height = 256;
{
  const f = fog.getContext("2d");
  for (let n = 0; n < 70; n++) {
    const x = Math.random() * 1024, y = 60 + Math.random() * 140, r = 40 + Math.random() * 110;
    for (const dx of [-1024, 0, 1024]) { // draw across the seam so the tile wraps cleanly
      const g = f.createRadialGradient(x + dx, y, 0, x + dx, y, r);
      g.addColorStop(0, `rgba(235, 238, 245, ${0.05 + Math.random() * 0.07})`);
      g.addColorStop(1, "rgba(235, 238, 245, 0)");
      f.fillStyle = g;
      f.fillRect(x + dx - r, y - r, r * 2, r * 2);
    }
  }
}
function drawFog(t, top, height, speed, alpha) {
  const scale = height / fog.height, tw = fog.width * scale;
  const shift = (t * speed) % tw;
  bctx.globalAlpha = alpha;
  for (let x = -shift; x < bgCanvas.width; x += tw) bctx.drawImage(fog, x, top, tw, height);
  bctx.globalAlpha = 1;
}

function drawBackground(now) {
  const t = now / 1000;
  if (!bg) { floorY = canvas.height - 20; return; }
  const { meta, img, off } = bg;
  // cover the screen, keep the bottom (the ground) anchored and crop sky first
  const k = Math.max(bgCanvas.width / meta.w, bgCanvas.height / meta.h);
  const w = meta.w * k, h = meta.h * k;
  const x = (bgCanvas.width - w) / 2, y = bgCanvas.height - h;
  bctx.drawImage(img, x, y, w, h);

  // far fog drifts slowly behind everything
  drawFog(t, y + h * 0.35, h * 0.45, 10 * DPR, 0.8);

  for (const l of meta.lights) {
    const p = ((t / l.period + l.phase) % 1);
    const on = p < 0.55 || (p > 0.7 && p < 0.78); // long on, off, a short flick back on, off
    const cx = x + l.x * k, cy = y + l.y * k, r = l.r * k;
    if (!on) {
      bctx.drawImage(off, l.x - l.r, l.y - l.r, l.r * 2, l.r * 2, cx - r, cy - r, r * 2, r * 2);
      continue;
    }
    // glow breathes a little while the light is on
    const pulse = 0.75 + 0.25 * Math.sin(t * 6 + l.phase * 10);
    const g = bctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3);
    g.addColorStop(0, `rgba(255, 50, 50, ${0.35 * pulse})`);
    g.addColorStop(1, "rgba(255, 50, 50, 0)");
    bctx.globalCompositeOperation = "lighter";
    bctx.fillStyle = g;
    bctx.fillRect(cx - r * 3, cy - r * 3, r * 6, r * 6);
    bctx.globalCompositeOperation = "source-over";
  }

  // near fog hugs the ground, a bit faster for parallax
  drawFog(t, y + h * 0.62, h * 0.32, 22 * DPR, 0.9);
  floorY = Math.round((y + meta.groundY * k) / DPR / S);
}

// dust specks drifting through the air, one art pixel each
const dust = Array.from({ length: 45 }, () => ({ x: Math.random(), y: Math.random(), v: 0.15 + Math.random() * 0.5, s: Math.random() * 6 }));
function drawDust(dt, now) {
  ctx.fillStyle = "rgba(245, 246, 250, 0.55)";
  for (const d of dust) {
    d.x += (d.v * dt * 8) / canvas.width;
    d.y += Math.sin(now / 1000 + d.s) * dt * 0.004;
    if (d.x > 1) { d.x = 0; d.y = Math.random(); }
    ctx.fillRect(Math.round(d.x * canvas.width), Math.round(d.y * floorY), 1, 1);
  }
}
function drawShadow(x, width) {
  // soft contact shadow so his feet sit on the curb instead of floating over it
  ctx.fillStyle = "rgba(22, 24, 34, 0.32)";
  ctx.beginPath();
  ctx.ellipse(Math.round(x), floorY + 1, width / 2, 3, 0, 0, Math.PI * 2);
  ctx.fill();
}

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function ringFrame(meta, a) {
  let best = meta.ring[0].i, bestD = Infinity;
  for (const f of meta.ring) {
    const d = Math.abs(wrap(f.a - a));
    if (d < bestD) { bestD = d; best = f.i; }
  }
  return best;
}
function drawFrame({ meta, img }, i, x, floorY, flip) {
  const sx = (i % meta.cols) * meta.frameW, sy = Math.floor(i / meta.cols) * meta.frameH;
  const dx = Math.round(x - meta.frameW / 2), dy = Math.round(floorY - meta.frameH + 4);
  if (!flip) return ctx.drawImage(img, sx, sy, meta.frameW, meta.frameH, dx, dy, meta.frameW, meta.frameH);
  ctx.save();
  ctx.translate(dx + meta.frameW, dy);
  ctx.scale(-1, 1);
  ctx.drawImage(img, sx, sy, meta.frameW, meta.frameH, 0, 0, meta.frameW, meta.frameH);
  ctx.restore();
}

// ---- character state -------------------------------------------------------
let look = null, walk = null;
let mouse = null, lastMove = -Infinity;
addEventListener("pointermove", (e) => { mouse = { x: e.clientX / S, y: e.clientY / S }; lastMove = performance.now(); });

const ch = {
  x: null,           // set on the first frame, once the canvas has its real size
  target: null,      // x he is walking to
  facing: 1,         // 1 right, -1 left
  walkT: 0,          // walk cycle clock (s)
  angle: 0, engaged: false,
  idleUntil: 0,      // wander: stand still until this time
  gazeGoal: 0,       // wander: random direction he gawks at while standing
  nextGawk: 0,
};

function update(now, dt) {
  const headX = ch.x, headY = floorY - look.meta.frameH * 0.62;
  const attentive = mouse && now - lastMove < IDLE_AFTER;
  const canWalk = walk && look === sheets["0_base"];
  const margin = look.meta.frameW * 0.3;
  if (canvas.width < look.meta.frameW) return; // pane not laid out yet; placing him now would pin him to an edge
  if (ch.x === null) { ch.x = canvas.width / 2; ch.w = canvas.width; }
  if (ch.w !== canvas.width) { ch.x *= canvas.width / ch.w; ch.w = canvas.width; } // keep his relative spot on resize
  ch.x = Math.min(canvas.width - margin, Math.max(margin, ch.x)); // stay on screen after resizes

  if (canWalk && attentive) {
    // follow the cursor, but stop a little before reaching it
    const gap = mouse.x - ch.x;
    ch.target = Math.abs(gap) > look.meta.frameW * 0.6 ? mouse.x - Math.sign(gap) * look.meta.frameW * 0.3 : null;
  } else if (canWalk && !attentive && ch.target === null && now > ch.idleUntil) {
    ch.target = margin + Math.random() * (canvas.width - 2 * margin); // wander somewhere, for no reason
  } else if (!canWalk) {
    ch.target = null;
  }

  if (ch.target !== null) {
    ch.target = Math.min(canvas.width - margin, Math.max(margin, ch.target));
    const gap = ch.target - ch.x;
    const step = WALK_SPEED * dt;
    if (Math.abs(gap) <= step) {
      ch.x = ch.target;
      ch.target = null;
      ch.idleUntil = now + 1200 + Math.random() * 2500;
    } else {
      ch.facing = Math.sign(gap);
      ch.x += ch.facing * step;
      ch.walkT += dt * WALK_RATE;
      ch.engaged = false;
      const i = Math.floor(ch.walkT * walk.meta.fps) % walk.meta.count;
      drawShadow(ch.x, 46);
      drawFrame(walk, i, ch.x, floorY, ch.facing < 0);
      return;
    }
  }

  // standing: look at the cursor if it's active, otherwise gawk around at nothing
  let goal;
  if (attentive) {
    const dx = mouse.x - headX, dy = mouse.y - headY;
    const dead = look.meta.frameW * 0.07;
    const dist = Math.hypot(dx, dy);
    if (!ch.engaged && dist > dead) { ch.engaged = true; ch.angle = Math.atan2(dy, dx); }
    else if (ch.engaged && dist < dead * 0.6) ch.engaged = false;
    goal = Math.atan2(dy, dx);
  } else {
    if (now > ch.nextGawk) {
      ch.gazeGoal = Math.random() < 0.25 ? null : Math.random() * Math.PI * 2;
      ch.nextGawk = now + 700 + Math.random() * 1600;
    }
    if (ch.gazeGoal === null) ch.engaged = false;
    else if (!ch.engaged) { ch.engaged = true; ch.angle = ch.gazeGoal; }
    goal = ch.gazeGoal ?? ch.angle;
  }
  // frame-rate independent easing (~6/s): same feel at 30, 60 or 144 Hz
  if (ch.engaged) ch.angle += wrap(goal - ch.angle) * (1 - Math.exp(-dt * 6));
  drawShadow(ch.x, 40);
  drawFrame(look, ch.engaged ? ringFrame(look.meta, ch.angle) : 0, ch.x, floorY, false);
}

// ---- speech bubble -----------------------------------------------------------
const LINES = [
  "I'm lost...",
  "What even is a Zcash?",
  "I don't know anything about this ecosystem.",
  "I need to learn. Can you help me?",
  "Is a wallet... like a pocket?",
  "Someone said \"shielded\". Shielded from what?",
  "Wait. Everyone can see my payments?",
  "Where am I going? No idea.",
  "Privacy sounds important. I think.",
  "ZEC? Is that a sneeze?",
  "Hello? Anybody?",
  "Maybe if I follow that arrow I'll figure it out.",
];
const REACTIONS = [
  "Oh! Are you going to help me?",
  "Wait for me!",
  "Where are we going?",
  "You look like you know things.",
];
const speech = { text: "", typed: -1, start: 0, until: 0, next: performance.now() + 2500, last: null, wasAttentive: false };
const pickNew = (list) => {
  let t;
  do t = list[Math.floor(Math.random() * list.length)]; while (t === speech.last && list.length > 1);
  return t;
};
function say(text, now) {
  speech.text = text; speech.last = text; speech.typed = -1; speech.start = now;
  speech.until = now + 600 + text.length * 45 + 2600; // type it, then let it sit long enough to read
  bubble.classList.add("show");
}

function updateSpeech(now) {
  if (ch.x === null) return;
  const attentive = mouse && now - lastMove < IDLE_AFTER;
  const speaking = now < speech.until;
  // the cursor waking up after a quiet spell gets a reaction (most of the time)
  if (attentive && !speech.wasAttentive && !speaking && Math.random() < 0.6) say(pickNew(REACTIONS), now);
  speech.wasAttentive = attentive;
  if (!speaking && now > speech.next) say(pickNew(LINES), now);

  if (now >= speech.until) {
    if (bubble.classList.contains("show")) {
      bubble.classList.remove("show");
      speech.next = now + 5000 + Math.random() * 5000;
    }
    return;
  }
  // typewriter; the untyped rest stays in the layout (hidden) so the bubble doesn't grow while typing
  const n = Math.min(speech.text.length, Math.floor((now - speech.start) / 40));
  if (n !== speech.typed) {
    speech.typed = n;
    bubble.innerHTML = "";
    bubble.append(speech.text.slice(0, n));
    const rest = document.createElement("span");
    rest.style.visibility = "hidden";
    rest.textContent = speech.text.slice(n);
    bubble.append(rest);
  }
  // anchor the tail just above his head, keep the bubble on screen
  const headTop = (floorY - look.meta.bodyH) * S;
  const headX = ch.x * S;
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  const left = Math.min(innerWidth - w - 12, Math.max(12, headX - w * 0.3));
  const top = headTop - h - S * 8;
  bubble.style.translate = `${Math.round(left)}px ${Math.round(top)}px`;
  bubble.style.setProperty("--tail-x", `${Math.min(w - S * 4, Math.max(S * 4, headX - left))}px`);
}

let last = performance.now();
function tick(now = performance.now()) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground(now);
  drawDust(dt, now);
  if (look) { update(now, dt); updateSpeech(now); }
}

// ---- variant buttons -------------------------------------------------------
const bar = document.getElementById("bar");
VARIANTS.forEach((name, k) => {
  const b = document.createElement("button");
  b.textContent = LABELS[k];
  b.onclick = async () => {
    try { look = await load(name); } catch { b.textContent = LABELS[k] + " (yok)"; return; }
    bar.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  };
  bar.appendChild(b);
});
(async () => {
  look = await load("0_base");
  bar.children[0].classList.add("on");
  try { walk = await load("walk"); } catch {}
})();
tick();
</script>
</body>
</html>
